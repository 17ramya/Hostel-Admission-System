spring.application.name=backend
# Render injects the PORT environment variable for Web Services. Fall back to 8080 locally.
server.port=${PORT:8080}
# MongoDB Atlas connection string.
# On Render this MUST come from the MONGO_URI environment variable
# (Render Dashboard -> backend service -> Environment). There is deliberately no in-repo
# fallback: the credentials that used to be hardcoded here have been rotated, so a fallback
# would only mask a broken deploy with a dead connection string. A missing variable fails fast
# with "Could not resolve placeholder", which is the correct, obvious signal in production.
# serverSelectionTimeoutMS/connectTimeoutMS stop a broken connection from hanging for 30s.
# The line below is a plain placeholder. Never wrap it in backticks or quotes, and never inline
# the real connection string: a stray character here aborts context startup and takes the whole
# service down, which is exactly how the "5000` is not a valid integer" outage started.
spring.data.mongodb.uri=${MONGO_URI}

# NOTE: "spring.mongodb.uri" is not a real Spring Boot property - it was removed because
# only "spring.data.mongodb.uri" is read by Spring Data MongoDB.

